<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Decode speed vs actual populated context</title>
  <desc id="desc">Line chart comparing 96K and 128K variants at 1K, 8K, 16K, 32K, and 64K populated context.</desc>
  <rect width="960" height="500" fill="#fff"/>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #24292f; }
    .title { font-size: 21px; font-weight: 600; }
    .axis-title { font-size: 15px; font-weight: 600; }
    .tick { font-size: 13px; fill: #57606a; }
    .legend { font-size: 13px; }
    .grid { stroke: #d8dee4; stroke-width: 1; }
    .axis { stroke: #57606a; stroke-width: 1.5; }
  </style>
  <text class="title" x="480" y="31" text-anchor="middle">Decode speed vs actual populated context</text>
  <line x1="650" y1="59" x2="680" y2="59" stroke="#0969da" stroke-width="3"/><circle cx="665" cy="59" r="4" fill="#0969da"/>
  <text class="legend" x="688" y="64">96K variant</text>
  <line x1="780" y1="59" x2="810" y2="59" stroke="#cf222e" stroke-width="3"/><circle cx="795" cy="59" r="4" fill="#cf222e"/>
  <text class="legend" x="818" y="64">128K variant</text>

  <g class="grid">
    <line x1="140" y1="390" x2="860" y2="390"/><line x1="140" y1="316.25" x2="860" y2="316.25"/>
    <line x1="140" y1="242.5" x2="860" y2="242.5"/><line x1="140" y1="168.75" x2="860" y2="168.75"/>
    <line x1="140" y1="95" x2="860" y2="95"/>
  </g>
  <line class="axis" x1="140" y1="95" x2="140" y2="390"/><line class="axis" x1="140" y1="390" x2="860" y2="390"/>
  <g class="tick" text-anchor="end">
    <text x="121" y="395">35</text><text x="121" y="321.25">40</text><text x="121" y="247.5">45</text>
    <text x="121" y="173.75">50</text><text x="121" y="100">55</text>
  </g>
  <g class="tick" text-anchor="middle">
    <text x="140" y="415">1K</text><text x="320" y="415">8K</text><text x="500" y="415">16K</text>
    <text x="680" y="415">32K</text><text x="860" y="415">64K</text>
  </g>
  <text class="axis-title" x="500" y="456" text-anchor="middle">Populated context</text>
  <text class="axis-title" x="34" y="242.5" text-anchor="middle" transform="rotate(-90 34 242.5)">Decode tokens/second</text>

  <polyline points="140,123.32 320,160.49 500,194.56 680,257.55 860,346.49" fill="none" stroke="#0969da" stroke-width="3"/>
  <polyline points="140,118.90 320,164.62 500,201.995 680,253.14 860,346.64" fill="none" stroke="#cf222e" stroke-width="3"/>
  <g fill="#0969da"><circle cx="140" cy="123.32" r="4"/><circle cx="320" cy="160.49" r="4"/><circle cx="500" cy="194.56" r="4"/><circle cx="680" cy="257.55" r="4"/><circle cx="860" cy="346.49" r="4"/></g>
  <g fill="#cf222e"><circle cx="140" cy="118.90" r="4"/><circle cx="320" cy="164.62" r="4"/><circle cx="500" cy="201.995" r="4"/><circle cx="680" cy="253.14" r="4"/><circle cx="860" cy="346.64" r="4"/></g>
</svg>
